# Builds and releases ugctl, the command-line client. Releases are made by
# .github/workflows/release.yml when a "v*" tag is pushed; see
# CONTRIBUTING.md#releasing.
#
# Try it locally with: goreleaser release --snapshot --clean
version: 2

project_name: ubergang

builds:
  - id: ugctl
    main: ./cmd/ugctl
    binary: ugctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .CommitDate }}
    # Reproducible builds: the same commit gives the same binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: ugctl
    ids:
      - ugctl
    name_template: "ugctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - docs/cli.md

checksum:
  name_template: checksums.txt

changelog:
  # Release notes generated by GitHub from the merged pull requests.
  use: github-native

release:
  github:
    owner: boivie
    name: ubergang
  # Tags such as v1.2.0-rc.1 are marked as pre-releases.
  prerelease: auto
