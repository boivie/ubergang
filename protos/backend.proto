syntax = "proto3";
package models;

import "google/protobuf/timestamp.proto";

option go_package = "./server/models";

message Header {
  string name = 1;
  string value = 2;
}

enum AccessLevel {
  // Required first variant in a proto enum. Will default to NORMAL.
  ACCESS_LEVEL_UNSPECIFIED = 0;
  // Requires to be logged in, and backend included in user's access.
  NORMAL = 1;
  // No authentication required - public endpoint.
  PUBLIC = 2;
}

enum AccessRuleAction {
  // Not a valid action. Rejected when saving, and treated as DENY if found.
  ACCESS_RULE_ACTION_UNSPECIFIED = 0;
  // No authentication required.
  ACCESS_RULE_PUBLIC = 1;
  // Requires to be logged in, and backend included in user's access.
  ACCESS_RULE_AUTHENTICATED = 2;
  // The request is rejected.
  ACCESS_RULE_DENY = 3;
}

message AccessRule {
  // CEL expression evaluating to a bool. See server/access for variables.
  string predicate = 1;
  AccessRuleAction action = 2;
}

message ScriptHandler {
  string js_script = 1;
}

// Ref: "be:$fqdn" -> Backend
message Backend {
  string fqdn = 1;
  string upstream_url = 2;
  repeated Header headers = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  AccessLevel access_level = 6;
  ScriptHandler script_handler = 7;
  // If set, specifies the fingerprint of one of the certificates in the
  // certificate chain. If this is not set, it expects a system trusted
  // certificate. Only used backends using TLS, not HTTP.
  string pinned_certificate_fingerprint = 8;
  // Evaluated in order; the first rule whose predicate matches decides the
  // access. If no rule matches, `access_level` is used.
  repeated AccessRule access_rules = 9;
}
