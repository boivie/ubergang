# Releases ugctl when a version tag, such as v1.2.0, is pushed. See
# CONTRIBUTING.md#releasing.
name: Release

on:
  push:
    tags:
      - "v*"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ugctl
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub release.
      contents: write
      # Sign and store the build provenance attestations.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser needs the tags to find the previous release.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true
      - name: Test
        run: go test ./cmd/ugctl/...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt
